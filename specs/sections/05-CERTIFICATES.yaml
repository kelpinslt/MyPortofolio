      - ".jpg"
      - ".jpeg"

    Verification:
      Required_Before_Implementation: true
      Current_Status: "not verified from the section reference image"
      Rule:
        "Every image path and extension in data/certificates.ts must exactly
        match the real file inside public/images/certificates."

    Image_Rules:
      Aspect_Ratio: "1.815 / 1"
      Object_Fit: "cover"
      Object_Position: "center"
      Preserve_Certificate_Readability: true
      First_Image_Priority: true
      Remaining_Images_Lazy_Load: true

  # =====================================================================
  # SIMPLE PROJECT COMPONENT STRUCTURE
  # =====================================================================

  COMPONENT_FILES:

    Required:

      - Path: "components/sections/certificates/CertificatesSection.tsx"
        Responsibility:
          - "Render the complete Certificates section."
          - "Render header, grid, quote, and section-level decorations."
          - "Read all visible content from data/certificates.ts."
          - "Orchestrate entrance animation."

      - Path: "components/cards/CertificateCard.tsx"
        Responsibility:
          - "Render one reusable certificate card."
          - "Render certificate image, organization, category, and date."
          - "Use credentialUrl only when a real URL exists."

      - Path: "components/decorations/DotGrid.tsx"
        Responsibility:
          - "Render reusable dot-grid ornaments."

      - Path: "components/decorations/GlowLayer.tsx"
        Responsibility:
          - "Render ambient red glows."

      - Path: "components/decorations/Hexagon.tsx"
        Responsibility:
          - "Render reusable hexagon ornaments."

      - Path: "components/decorations/NoiseLayer.tsx"
        Responsibility:
          - "Render subtle monochrome noise."

      - Path: "components/decorations/ParticleBackground.tsx"
        Responsibility:
          - "Render the Certificates particle field."
          - "Use the particle quantities and behavior defined in this specification."
          - "Respect reduced motion and viewport visibility."

      - Path: "data/certificates.ts"
        Responsibility:
          - "Store the section heading, description, quote, and eight certificate entries."

    Optional:

      - Path: "components/ui/SectionLabel.tsx"
        Create_Only_When:
