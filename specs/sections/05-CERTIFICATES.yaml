      - "Particle harus berada di belakang seluruh konten."

    Outer_Container:

      - "Container memiliki border merah tipis, bukan neon tebal."

      - "Radius desktop sekitar 31px."

      - "Container hampir memenuhi viewport tetapi tetap memiliki margin luar."

      - "Semua elemen dekoratif harus terpotong oleh radius outer container."

    Header:

      - "Header selalu rata kiri dengan card pertama."

      - "Ornamen garis berada di atas judul."

      - "My berwarna putih."

      - "Certifications memakai gradient merah."

      - "Judul tidak boleh terlalu jauh dari ornamen garis."

      - "Description harus terdiri dari dua baris pada desktop."

    Certificate_Grid:

      - "Desktop menggunakan empat card per baris."

      - "Card memiliki ukuran visual yang sama."

      - "Jarak antar-card sekitar 18px."

      - "Baris kedua dimulai sekitar 16px setelah card baris pertama."

      - "Grid tidak boleh terlalu dekat dengan outer border."

    Certificate_Card:

      - "Card menggunakan background hitam dengan sedikit tint merah."

      - "Card border tipis dan redup."

      - "Shadow utama berwarna hitam."

      - "Glow merah hanya sangat halus."

      - "Image memenuhi hampir seluruh lebar bagian dalam card."

      - "Semua image menggunakan aspect ratio konsisten."

      - "Nama organisasi maksimum satu baris pada desktop."

      - "Badge berada tepat di bawah nama organisasi."

      - "Tanggal berada di bagian bawah card."

    Ornament:

      - "Dot grid kanan atas opacity rendah."

      - "Hexagon tidak boleh bersaing dengan judul atau card."

      - "Hexagon selalu berada di belakang konten."

      - "Partikel tidak boleh berada di atas teks."

      - "Ornamen kiri bawah hanya terlihat sebagian."

    Quote:

      - "Quote berada di tengah bawah halaman."

      - "Quote tidak boleh lebih lebar dari 620px pada desktop."

      - "Border dan glow quote lebih redup daripada card."

    Hover:

