  Enabled: true
  Mandatory: true
  Source: "intentional_enhancement"
  Visible_In_Static_Reference: false

  Intent:
    - "Add subtle movement to the otherwise empty right side."
    - "React to cursor movement using repulse behavior."
    - "Preserve the minimalist composition."
    - "Never compete visually with WHO / I AM."

  Layer:
    Z_Index: 2
    Pointer_Events: "none"

  Area:
