# ==============================================================================
# KELPINN PORTFOLIO — HERO SECTION
# VERSION : 2.1 — FIGMA-ALIGNED + INTENTIONAL INTERACTIVE PARTICLES
# ==============================================================================
#
# STATUS:
#   - Static layout: measured from the supplied Hero reference image.
#   - Interactive particles: intentionally preserved from the previous Hero spec.
#   - This document does not claim to be a direct Figma Inspect export.
#
# MEASUREMENT METHOD:
#   Reference image : 715 x 462 px
#   Desktop target  : 1440 x 930 px
#   Scale X         : 1440 / 715 = 2.013986
#   Scale Y         : 930 / 462 = 2.012987
#
# IMPORTANT:
#   Values under Reference_Pixels are direct measurements from the supplied image.
#   Values under Desktop_1440 are normalized implementation values.
#   Actual Figma Inspect values take priority if supplied later.
# ==============================================================================

schema_version: "2.1"
document_role: "section_specification"
document_status: "implementation_ready"

SECTION:
  ID: "hero"
  Order: 1
  Name: "Hero — Who I Am"
  Component: "HeroSection"
  Route: "/"
  Anchor: "#hero"

REFERENCE:
  Image_Path: "../references/hero.png"
  Source_Type: "Static Figma reference screenshot"

  Reference_Pixels:
    Width: 715px
    Height: 462px

  Desktop_1440:
    Width: 1440px
    Height: 930px

  Scale:
    X: 2.013986
    Y: 2.012987

  Measurement_Confidence:
    Frame: "high"
    Navbar_Bounds: "high"
    Text_Bounds: "high"
    About_Button_Bounds: "high"
    Exact_Font_Metrics: "medium"
    Exact_Color_Hex: "medium"
    Particle_Layout: "intentional enhancement, not measured from screenshot"

  Rules:
    - "Use the static reference as the source of truth for composition and hierarchy."
    - "Do not treat estimated values as original Figma Inspect values."
    - "Preserve the interactive particle background even though it is not visible in the static screenshot."
    - "Do not let particles change the measured static layout."
    - "Do not redesign, center, or fill the intentional empty space."

PROJECT:
  Name: "Kelpinn Portfolio"
  Type: "Personal Developer Portfolio"

  Stack:
