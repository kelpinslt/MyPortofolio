    Left_Fade:
      Start_X: 620px
      Full_Visibility_X: 760px

  Particles:
    Count:
      Desktop: 120
      Laptop: 95
      Tablet: 65
      Mobile: 35

    Shape: "circle"

    Size:
      Min: 2px
      Max: 4px

    Colors:
      Primary:
        Value: "#7F1D1D"
        Ratio: 0.78

      Accent:
        Value: "#EF4444"
        Ratio: 0.22

    Opacity:
      Min: 0.14
      Max: 0.48

    Random: true

  Links:
    Enabled: true
    Distance: 150px
    Width: 1px
    Color: "#7F1D1D"
    Opacity: 0.20

  Movement:
    Enabled: true
    Speed: 0.8
    Direction: "none"
    Random: true
    Straight: false
    Out_Mode: "bounce"

  Mouse:
