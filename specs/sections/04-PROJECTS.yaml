    Outer_Margin_X: 14px

    Section_Padding_X: 28px

    Section_Padding_Top: 36px

    Grid_Columns: 2

    Grid_Gap_X: 18px

    Grid_Gap_Y: 18px

    Card_Width: "calc((100% - 18px) / 2)"

    Card_Height: auto

    Image_Height: 155px

    Header_Title_Size: 44px

    Header_Title_Line_Height: 48px

    Header_Description_Size: 14px

    Outer_Container_Radius: 26px

  MOBILE:

    Viewport_Range: "360px–767px"

    Outer_Margin_X: 10px

    Section_Padding_X: 16px

    Section_Padding_Top: 30px

    Section_Padding_Bottom: 30px

    Grid_Columns: 1

    Grid_Gap_X: 0px

    Grid_Gap_Y: 16px

    Card_Width: 100%

    Card_Height: auto

    Card_Padding: 9px

    Image_Width: 100%

    Image_Height: "clamp(150px, 48vw, 205px)"

    Header_Title_Size: 38px

    Header_Title_Line_Height: 42px

    Header_Title_Wrap: true

    Header_Description_Size: 14px

    Header_Description_Line_Height: 22px

    Header_Width: 100%

    Section_Label_Size: 12px

    Section_Label_Line_Width: 58px

    Badge_Wrap: true

    Badge_Row_Gap: 6px

    Button_Group_Direction: "Horizontal"

    Button_Group_Gap: 8px

    Button_Width: "50%"

    Outer_Container_Radius: 22px

  MOBILE_SMALL:

    Viewport_Max: 359px

    Header_Title_Size: 34px

    Section_Padding_X: 13px

    Button_Group_Direction: "Vertical"

    Button_Width: 100%

    Card_Description_Max_Lines: 3

  # ==========================================================
  # ACCESSIBILITY
  # ==========================================================

  ACCESSIBILITY:

    Section:

      Semantic_Element: "section"

      Aria_Labelledby: "projects-title"

    Project_Grid:

      Semantic_Element: "ul"

      Role: "list"

    Project_Card:

      Semantic_Element: "li"

    Project_Image:

      Alt_Text: "{{project.imageAlt}}"

      Lazy_Load: true

      Decoding: "async"

    Case_Study_Button:

      Semantic_Element: "Link"

      Aria_Label: "View case study for {{project.title}}"

    Website_Button:

      Semantic_Element: "External Link"

      Aria_Label: "Visit website for {{project.title}}"

      Target: "_blank"

      Rel: "noopener noreferrer"

    Focus:

      Visible: true

      Color: "#EF2B2B"

      Width: 2px

      Offset: 3px

    Contrast:

      Text_Primary_Minimum: "WCAG AA"

      Button_Minimum: "WCAG AA"

    Reduced_Motion:

      Respect_Prefers_Reduced_Motion: true

      Disable:
        - "Card translate animation"
        - "Particle movement"
        - "Image scale hover"

  # ==========================================================
  # FRONTEND COMPONENT STRUCTURE
  # ==========================================================

  COMPONENT_FILES:

    Required:

      - Path: "components/sections/projects/ProjectsSection.tsx"
        Responsibility:
          - "Render the complete Projects section."
          - "Render header, project grid, and section-level decorations."
          - "Read visible content from data/projects.ts."
          - "Orchestrate section and card entrance animations."

      - Path: "components/cards/ProjectCard.tsx"
        Responsibility:
          - "Render one reusable project card."
          - "Render image, title, description, technology badges, and actions."
          - "Render disabled action buttons when URLs are null."

      - Path: "components/decorations/DotGrid.tsx"
        Responsibility:
          - "Render reusable dot-grid ornaments."

      - Path: "components/decorations/GlowLayer.tsx"
        Responsibility:
          - "Render radial ambient glows."

      - Path: "components/decorations/Hexagon.tsx"
        Responsibility:
          - "Render reusable hexagon decorations."

      - Path: "components/decorations/NoiseLayer.tsx"
        Responsibility:
          - "Render subtle monochrome noise."

      - Path: "components/decorations/ParticleBackground.tsx"
        Responsibility:
          - "Render sparse red particles using the Projects particle settings."
          - "Respect reduced motion and pause outside the viewport."

      - Path: "data/projects.ts"
        Responsibility:
          - "Store Projects header content and all eight project entries."

    Optional:

      - Path: "components/ui/SectionLabel.tsx"
        Create_Only_When:
          - "The same section-label ornament is reused by several sections."

    Do_Not_Create:
      - "components/projects/ProjectGrid.tsx"
      - "components/projects/TechnologyBadge.tsx"
      - "components/background/ProjectParticles.tsx"
      - "components/background/HexagonDecoration.tsx"
      - "PuskesmasCard.tsx"
      - "CoffeeCard.tsx"
      - "TravelTrackCard.tsx"
      - "DashboardCard.tsx"
      - "BemCard.tsx"
      - "VidentiCard.tsx"
      - "PortfolioCard.tsx"
      - "EcommerceCard.tsx"

