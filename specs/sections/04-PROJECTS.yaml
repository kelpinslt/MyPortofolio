  # ==========================================================
  # COMPONENT HIERARCHY
  # ==========================================================

  COMPONENT_HIERARCHY: |

    PROJECTS_FRAME
    ├── PROJECTS_BACKGROUND
    │   ├── BACKGROUND_BASE
    │   ├── BACKGROUND_RADIAL_GLOW_TOP
    │   ├── BACKGROUND_RADIAL_GLOW_CENTER
    │   ├── BACKGROUND_RADIAL_GLOW_BOTTOM
    │   ├── BACKGROUND_NOISE
    │   ├── BACKGROUND_PARTICLES
    │   ├── DOT_GRID_TOP_RIGHT
    │   ├── DOT_GRID_BOTTOM_RIGHT
    │   ├── HEXAGON_GROUP_TOP_RIGHT
    │   │   ├── HEXAGON_TOP_MEDIUM
    │   │   ├── HEXAGON_TOP_LARGE
    │   │   └── HEXAGON_TOP_SMALL
    │   └── HEXAGON_GROUP_BOTTOM_LEFT
    │       ├── HEXAGON_BOTTOM_SMALL
    │       └── HEXAGON_BOTTOM_PARTIAL
    │
    └── PROJECTS_OUTER_CONTAINER
        ├── PROJECTS_HEADER
        │   ├── PROJECTS_SECTION_LABEL_ROW
        │   │   ├── LABEL_CIRCLE
        │   │   ├── LABEL_SHORT_LINE
        │   │   ├── LABEL_TEXT
        │   │   ├── LABEL_LONG_LINE
        │   │   └── LABEL_END_DOT
        │   ├── PROJECTS_MAIN_TITLE
        │   │   ├── TITLE_FEATURED
        │   │   └── TITLE_PROJECTS
        │   └── PROJECTS_DESCRIPTION
        │
        └── PROJECTS_GRID
            └── PROJECT_CARD_MASTER × N
                ├── PROJECT_CARD_IMAGE_FRAME
                │   ├── PROJECT_CARD_IMAGE
                │   └── PROJECT_CARD_IMAGE_OVERLAY
                └── PROJECT_CARD_CONTENT
                    ├── PROJECT_CARD_TITLE
                    ├── PROJECT_CARD_DESCRIPTION
                    ├── PROJECT_CARD_BADGE_GROUP
                    │   └── PROJECT_TECH_BADGE × N
                    └── PROJECT_CARD_BUTTON_GROUP
                        ├── PROJECT_BUTTON_CASE_STUDY
                        └── PROJECT_BUTTON_VISIT

  # ==========================================================
  # FULL LAYER ORDER
  # ==========================================================

  LAYER_ORDER:

    0: "PROJECTS_FRAME"

    1: "BACKGROUND_BASE"

    2: "BACKGROUND_RADIAL_GLOW"

    3: "BACKGROUND_NOISE"

    4: "BACKGROUND_PARTICLES"

    5: "BACKGROUND_DOT_GRIDS"

    6: "BACKGROUND_HEXAGONS"

    10: "PROJECTS_OUTER_CONTAINER"

    20: "PROJECTS_HEADER"

    21: "SECTION_LABEL"

    22: "SECTION_TITLE"

    23: "SECTION_DESCRIPTION"

    30: "PROJECTS_GRID"

    40: "PROJECT_CARD_MASTER"

    41: "PROJECT_CARD_IMAGE"

    42: "PROJECT_CARD_IMAGE_OVERLAY"

    43: "PROJECT_CARD_TEXT_CONTENT"

    44: "PROJECT_CARD_BADGES"

    45: "PROJECT_CARD_BUTTONS"

    50: "PROJECT_CARD_HOVER_STATE"

  # ==========================================================
  # SECTION ANIMATION
  # ==========================================================

  SECTION_ANIMATION:

    Initial_State:

      Opacity: 0

      Translate_Y: 34px

    Enter_State:

      Opacity: 1

      Translate_Y: 0px

    Duration: 800ms

    Easing: "cubic-bezier(0.22,1,0.36,1)"

  HEADER_ANIMATION:

    Label:

      Initial:
        Opacity: 0
        Translate_X: -18px

      Animate:
        Opacity: 1
        Translate_X: 0px

      Delay: 100ms

      Duration: 600ms

    Title:

      Initial:
        Opacity: 0
        Translate_Y: 24px

      Animate:
        Opacity: 1
        Translate_Y: 0px

      Delay: 180ms

      Duration: 700ms

    Description:

      Initial:
        Opacity: 0
        Translate_Y: 16px

      Animate:
        Opacity: 1
        Translate_Y: 0px

      Delay: 260ms

      Duration: 650ms

  PROJECT_CARD_ANIMATION:

    Type: "Staggered Fade Up"

    Initial:

      Opacity: 0

      Translate_Y: 28px

      Scale: 0.985

    Animate:

      Opacity: 1

      Translate_Y: 0px

      Scale: 1

    Duration: 580ms

    Stagger_Delay: 70ms

    Easing: "cubic-bezier(0.22,1,0.36,1)"

    Trigger:

      Type: "Intersection Observer"

      Once: true

      Threshold: 0.12

  # ==========================================================
  # PARTICLE ANIMATION
  # ==========================================================

  PARTICLE_ANIMATION:

    Enabled: true

    Movement:

      Speed: 0.25

      Direction: "Random"

      Straight: false

      Out_Mode: "Bounce"

    Twinkle:

      Enabled: true

      Frequency: 0.02

      Opacity_Min: 0.10

      Opacity_Max: 0.70

    Interaction:

      Hover: false

      Click: false

    Performance:

      FPS_Limit: 40

      Retina_Detect: true

      Reduce_On_Mobile: true

  # ==========================================================
  # RESPONSIVE SPECIFICATION
  # ==========================================================

  BREAKPOINTS:

    Mobile_SM: 360px

    Mobile: 480px

    Tablet: 768px

    Laptop: 1024px

    Desktop: 1280px

    Wide: 1536px

  DESKTOP_WIDE:

    Viewport_Min: 1536px

    Outer_Margin_X: 18px

    Section_Padding_X: 64px

    Section_Padding_Top: 43px

    Grid_Columns: 4

    Grid_Gap_X: 18px

    Grid_Gap_Y: 18px

    Card_Width: 334px

    Card_Height: 336px

    Header_Title_Size: 56px

  DESKTOP:

    Viewport_Range: "1280px–1535px"

