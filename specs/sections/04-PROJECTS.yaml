    Section_Padding_X: 48px

    Section_Padding_Top: 42px

    Grid_Columns: 4

    Grid_Gap_X: 16px

    Grid_Gap_Y: 18px

    Card_Width: "Flexible"

    Card_Height: 336px

    Header_Title_Size: 54px

  LAPTOP:

