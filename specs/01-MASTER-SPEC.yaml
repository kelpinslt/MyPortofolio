global_behavior:
  responsive_strategy:
  - Use responsive constraints instead of proportionally scaling the desktop frame.
  - Use Grid or Flexbox for main content.
  - Reduce decorative density and particle opacity/count on smaller screens.
  - Use section-specific mobile/tablet rules where provided.
  motion_strategy:
  - Use section entrance fade/up behavior where provided.
  - Use restrained hover translation and scale.
  - Respect prefers-reduced-motion where explicitly required.
  accessibility:
  - Use semantic section elements and aria-labelledby where specified.
  - Provide alt text for images.
  - Decorative elements must be aria-hidden.
  - Decorative elements must not intercept pointer events.
  - Maintain minimum contrast for muted text.
  - Respect prefers-reduced-motion.
  performance:
  - Limit particle count on desktop where specified.
  - Reduce particles on tablet and mobile.
  - Use CSS or SVG for simple hexagons.
  - Avoid large PNG files for simple ornaments.
  - Use lazy image loading except where the section explicitly prioritizes the first image.
content_rules:
