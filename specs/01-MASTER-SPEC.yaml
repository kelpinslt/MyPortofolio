design_principles:
- Black or near-black surfaces remain dominant.
- Red is used as accent, border, glow, particle, and emphasis.
- Glow remains controlled and section-specific.
- Decorations remain behind readable content.
- Primary layout uses Grid or Flexbox.
- Absolute positioning is reserved for decorative/background layers.
- Repeated card content is data-driven and reusable.
- Desktop coordinates are reference baselines, not universal responsive positions.
implementation_stack:
  required:
  - Next.js 16
  - TypeScript
  - Tailwind CSS
  - Framer Motion
  - Lucide React
  conditional_or_section_specific:
