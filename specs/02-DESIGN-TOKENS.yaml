schema_version: "2.0"
document_role: "design_token_specification"
document_status: "global_fallbacks_locked_section_overrides_preserved"

token_policy:
  strategy: "global_fallbacks_plus_explicit_section_overrides"

  rules:
    - "Global tokens are fallbacks, not replacements for explicit section values."
    - "Section YAML always wins when it declares an explicit visual value."
    - "Intentional differences between sections are not unresolved conflicts."
    - "Do not merge visually different reds, backgrounds, radii, or title sizes into one forced value."
    - "Detailed measurements remain in the five section specifications."

global_defaults:
  font_families:
    primary: "Inter Variable, Inter, Arial, sans-serif"
    mono_optional: "JetBrains Mono, monospace"
    hero_brand_initial: "Georgia, 'Times New Roman', serif"

  colors:
    page_fallback: "#020202"
    surface_fallback: "#080808"
    card_fallback: "#0B0B0B"

    text_primary: "#F5F5F5"
    text_secondary: "#A3A3A3"
    text_muted: "#8A8A8A"

    red_primary_fallback: "#EF2B2B"
    red_dark_fallback: "#7F1015"
    red_bright_fallback: "#FF2D2D"

    transparent: "transparent"

  spacing_scale:
    space_1: 4px
    space_2: 8px
    space_3: 12px
    space_4: 16px
    space_5: 20px
    space_6: 24px
    space_7: 28px
    space_8: 32px
    space_10: 40px
    space_12: 48px
    space_16: 64px
    space_20: 80px

  breakpoints:
    mobile_sm: 360px
    mobile: 480px
    tablet: 768px
    laptop: 1024px
    desktop: 1280px
    wide: 1536px

  z_index_pattern:
    page_background: 0
    background_effects: "1-5"
    section_container: 10
    section_content: "20-23"
    grids: 30
    cards: 40
    card_children: "41-45"
    hover_layer: 50
    navbar: 100

  motion:
    easing_primary: "cubic-bezier(0.22, 1, 0.36, 1)"
    easing_secondary: "cubic-bezier(0.22, 0.61, 0.36, 1)"
    fast: 180ms
    normal: 350ms
    slow: 700ms
    respect_reduced_motion: true

  accessibility:
    visible_focus_width: 2px
    decorative_aria_hidden: true
    decorative_pointer_events: "none"

section_overrides:
  hero:
    source: "./sections/01-HERO.yaml"

    colors:
      page: "#000000"
      navbar: "#040000"
      red_primary: "#BD1219"
      red_dark: "#670000"
      red_deep: "#440000"
      red_bright: "#EF1B24"
      red_glow_core: "#FF1A1A"
      text_primary: "#FFFFFF"
      text_secondary: "#D4D4D8"
      text_muted: "#A1A1AA"

    typography:
      hero_title_size: 92px
      hero_title_weight: 800
      hero_title_line_height: 0.86
      hero_title_letter_spacing: -3.5px
      developer_size: 14px
      developer_letter_spacing: 6px
      navbar_size: 14px
      brand_initial_size: 40px
      brand_name_size: 16px

    radius:
      navbar: 14px
      about_button: 0px
      glow_dot: 999px

    motion:
      navbar_duration: 800ms
      who_delay: 180ms
      iam_delay: 320ms
      developer_delay: 560ms
      about_button_delay: 680ms
      role_interval: 3000ms
      role_transition: 350ms

    particles:
      mandatory: true
      desktop_count: 120
      hover_mode: "repulse"
      hover_distance: 180px

  about:
    source: "./sections/02-ABOUT.yaml"

    colors:
      frame_background: "#191A1B"
      container_background: "#202020"
      container_surface: "rgba(30, 30, 30, 0.96)"
      primary_red: "#E53135"
      primary_red_bright: "#FF3A3A"
      primary_red_dark: "#A90000"
      primary_red_deep: "#650000"
      text_primary: "#F5F5F5"
      text_secondary: "#C4C4C4"
      text_muted: "#A8A8A8"

    typography:
      label_size: 21px
      title_size: 59px
      subtitle_size: 31px
      description_size: 19px
      description_line_height: 36px

    radius:
      main_container: 34px
      photo_frame: 16px
      email_button: 12px
      social_button: 12px

    motion:
      photo_parallax_duration: 700ms
      photo_parallax_easing: "cubic-bezier(0.22, 0.61, 0.36, 1)"

  skills:
    source: "./sections/03-SKILLS.yaml"

    colors:
      background: "#040404"
      surface: "#080808"
      category_card: "#090909"
      technology_tile: "#101010"
      primary_red: "#FF2D2D"
      secondary_red: "#B30000"
      text_primary: "#FFFFFF"
      text_soft: "#A0A0A0"

    typography:
      label_size: 20px
      title_size: 64px
      description_size: 17px
      description_line_height: 23px
      category_title_size: 23px
      technology_label_size: 20px

    radius:
      outer_container: 38px
      category_card: 24px
      technology_tile: 14px

    motion:
      section_entrance: 1000ms
      category_hover: 500ms
      icon_floating: true

    particles:
      desktop_count: 35
      speed: 0.25

  projects:
    source: "./sections/04-PROJECTS.yaml"

    colors:
      background_main: "#050505"
      background_deep: "#020202"
      background_surface: "#090909"
      card_start: "#0E0D0D"
      card_end: "#080808"
      button_background: "#0C0C0C"
      primary_dark: "#7F1D1D"
      primary: "#B91C1C"
      primary_bright: "#EF2B2B"
      accent: "#FF2D2D"
      accent_hover: "#FF4343"
      text_primary: "#F5F5F5"
      text_secondary: "#A3A3A3"

    typography:
      heading_size: 56px
      heading_weight: 800
      heading_line_height: 1.05
      heading_letter_spacing: -2.15px
      section_label_size: 15px
      description_size: 15px
      description_line_height: 25px
      card_title_size: 16px
      card_description_size: 12px
      badge_size: 10px
      button_size: 11px

    radius:
      outer_container: 30px
      project_card: 14px
      image: 9px
      badge: 4px
      primary_button: 6px
      full: 999px

    effects:
      section_outer: "0 0 32px rgba(239,43,43,0.05)"
      card_default: "0 8px 25px rgba(0,0,0,0.55)"
      card_red_glow: "0 0 17px rgba(239,43,43,0.09)"
      card_hover: "0 15px 36px -8px rgba(239,43,43,0.18)"

    motion:
      section_duration: 800ms
      card_duration: 580ms
      stagger_delay: 70ms

    particles:
      mouse_interaction: false
      fps_limit: 40
      reduce_on_mobile: true

  certificates:
    source: "./sections/05-CERTIFICATES.yaml"

    colors:
      page_background: "#020202"
      section_background: "#050303"
      section_surface: "rgba(4, 3, 3, 0.82)"
      card_start: "#0B0909"
      card_end: "#060606"
      primary_red: "#EF2027"
      primary_red_bright: "#FF2A31"
      primary_red_dark: "#7F1015"
      primary_red_deep: "#3B070A"
      text_primary: "#F5F5F5"
      text_secondary: "#B3B3B3"
      text_muted: "#8A8A8A"

    typography:
      page_title_size: 58px
      page_title_weight: 800
      page_title_line_height: 64px
      page_title_letter_spacing: -2.4px
      description_size: 15px
      description_line_height: 25px
      card_title_size: 17px
      badge_size: 11px
      date_size: 12px
      quote_size: 14px

    spacing:
      section_padding_x: 68px
      section_padding_top: 54px
      header_to_grid: 29px
      grid_column_gap: 18px
      grid_row_gap: 16px
      card_padding_x: 18px
      card_padding_top: 14px
      card_padding_bottom: 14px

    radius:
      outer_container: 31px
      certificate_card: 14px
      certificate_image: 10px
      badge: 5px
      quote_box: 14px
      circle: 999px

    effects:
      outer_glow: "0 0 26px rgba(239,32,39,0.055)"
      card_shadow: "0 8px 24px -5px rgba(0,0,0,0.72)"
      card_red_glow: "0 0 15px rgba(239,32,39,0.065)"
      title_white_glow: "0 3px 9px rgba(255,255,255,0.18)"
      title_red_glow: "0 0 16px rgba(239,32,39,0.25)"

    motion:
      card_transition_duration: 380ms
      card_transition_easing: "cubic-bezier(0.22, 1, 0.36, 1)"

    particles:
      desktop_count: 150
      laptop_count: 110
      tablet_count: 75
      mobile_count: 35

resolved_variations:
  background:
    values:
      - "#000000"
      - "#191A1B"
      - "#040404"
      - "#050505"
      - "#020202"
    resolution: "intentional_section_overrides"

  primary_red:
    values:
      - "#BD1219"
      - "#E53135"
      - "#FF2D2D"
      - "#EF2B2B"
      - "#EF2027"
    resolution: "intentional_section_overrides"

  outer_container_radius:
    values:
      - 14px
      - 30px
      - 31px
      - 34px
      - 38px
    resolution: "intentional_component_and_section_variations"

  section_title_size:
    values:
      - 58px
      - 59px
      - 64px
      - 92px
    resolution: "intentional_title_role_variations"

  particle_interaction:
    resolution: "section_specific_behavior"

needs_confirmation: false